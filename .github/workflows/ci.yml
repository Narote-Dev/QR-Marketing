name: CI

on:
  pull_request:
  push:
    branches: [main, feature/dynamic-qr, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qr_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qr_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QR_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=qr_ci;Password=ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test backend/QrMarketing.Api.Tests/QrMarketing.Api.Tests.csproj --configuration Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/QrMarketing.Api.Tests/TestResults/*.trx

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker build --file Dockerfile --tag qr-marketing-api-root-ci .
